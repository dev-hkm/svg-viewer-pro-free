<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    .dot { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .18; transform: scale(.55); } 45% { opacity: 1; transform: scale(1); } }
  </style>
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120B26"/>
      <stop offset="100%" stop-color="#06131F"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bgp)"/>

  <g fill="#7DF9E4">
    <circle class="dot" cx="96" cy="96" r="14" style="animation-delay:0s"/>
    <circle class="dot" cx="176" cy="96" r="14" style="animation-delay:.15s"/>
    <circle class="dot" cx="256" cy="96" r="14" style="animation-delay:.3s"/>
    <circle class="dot" cx="336" cy="96" r="14" style="animation-delay:.45s"/>
    <circle class="dot" cx="416" cy="96" r="14" style="animation-delay:.6s"/>

    <circle class="dot" cx="96" cy="176" r="14" style="animation-delay:.15s"/>
    <circle class="dot" cx="176" cy="176" r="14" style="animation-delay:.3s"/>
    <circle class="dot" cx="256" cy="176" r="14" style="animation-delay:.45s"/>
    <circle class="dot" cx="336" cy="176" r="14" style="animation-delay:.6s"/>
    <circle class="dot" cx="416" cy="176" r="14" style="animation-delay:.75s"/>

    <circle class="dot" cx="96" cy="256" r="14" style="animation-delay:.3s"/>
    <circle class="dot" cx="176" cy="256" r="14" style="animation-delay:.45s"/>
    <circle class="dot" cx="256" cy="256" r="14" style="animation-delay:.6s"/>
    <circle class="dot" cx="336" cy="256" r="14" style="animation-delay:.75s"/>
    <circle class="dot" cx="416" cy="256" r="14" style="animation-delay:.9s"/>

    <circle class="dot" cx="96" cy="336" r="14" style="animation-delay:.45s"/>
    <circle class="dot" cx="176" cy="336" r="14" style="animation-delay:.6s"/>
    <circle class="dot" cx="256" cy="336" r="14" style="animation-delay:.75s"/>
    <circle class="dot" cx="336" cy="336" r="14" style="animation-delay:.9s"/>
    <circle class="dot" cx="416" cy="336" r="14" style="animation-delay:1.05s"/>

    <circle class="dot" cx="96" cy="416" r="14" style="animation-delay:.6s"/>
    <circle class="dot" cx="176" cy="416" r="14" style="animation-delay:.75s"/>
    <circle class="dot" cx="256" cy="416" r="14" style="animation-delay:.9s"/>
    <circle class="dot" cx="336" cy="416" r="14" style="animation-delay:1.05s"/>
    <circle class="dot" cx="416" cy="416" r="14" style="animation-delay:1.2s"/>
  </g>
</svg>
